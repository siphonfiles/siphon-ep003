name: kaggle zimage
# Ilustrații Z-Image-Turbo (Apache-2.0) pe Kaggle T4, fără cota Hugging Face și fără bani.
# Joburile vin din fișierul dat (illustrations/<ep>/*.json), încorporate în script (fără dataset).
# Rezultatul se ia cu "kaggle fetch" (kernel=siphon-zimage-t4).
on:
  workflow_dispatch:
    inputs:
      jobs:
        default: illustrations/ep003/key_scenes_kaggle.json

env:
  KUSER: ${{ secrets.KAGGLE_USERNAME }}
  KERNEL: siphon-zimage-t4

jobs:
  push:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet --upgrade "kaggle>=1.8" six
      - name: Push kernel (starts the run)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -e
          mkdir -p kn
          python - <<'P'
          import json
          src = open("kaggle/zimage_t4/run.py").read()
          jobs = json.dumps(json.load(open("${{ inputs.jobs }}")), ensure_ascii=False)
          open("kn/run.py", "w").write(src.replace("__JOBS__", jobs))
          P
          cat > kn/kernel-metadata.json <<J
          {"id": "$KUSER/$KERNEL", "title": "$KERNEL", "code_file": "run.py", "language": "python",
           "kernel_type": "script", "is_private": true, "enable_gpu": true, "enable_internet": true,
           "dataset_sources": [], "competition_sources": [], "kernel_sources": [],
           "machine_shape": "NvidiaTeslaT4"}
          J
          kaggle kernels push -p kn
          for i in $(seq 1 1100); do
            sleep 15
            s=$(kaggle kernels status "$KUSER/$KERNEL" 2>&1 || true)
            [ $((i % 8)) = 1 ] && echo "t=$((i*15))s $s"
            echo "$s" | grep -qE "COMPLETE|ERROR|CANCEL" && { echo "t=$((i*15))s $s"; break; }
          done
