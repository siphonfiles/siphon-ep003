name: kaggle fetch
# Citește starea rulării Kaggle și, dacă e gata, aduce rezultatul pe branch-ul renders (kaggle/run-N).
on:
  workflow_dispatch:
    inputs:
      kernel:
        default: siphon-longcat-t4

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet --upgrade "kaggle>=1.8" six
      - name: Status and output
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          K=${{ secrets.KAGGLE_USERNAME }}/${{ inputs.kernel }}
          kaggle kernels status "$K" | tee status.txt
          mkdir -p res
          kaggle kernels output "$K" -p res -o || true
          ls -laR res | head -50
          f=$(find res -name run_log.json | head -1)
          [ -n "$f" ] && python -c "import json,sys;d=json.load(open('$f'));print(d.get('status'),d.get('error'));print('\n'.join(d['log'][-40:]))"
          true
      - name: Publish to renders branch
        run: |
          set -e
          [ -n "$(find res -type f \( -name '*.mp4' -o -name '*.json' -o -name '*.png' -o -name '*.log' \) | head -1)" ] || exit 0
          git config user.name "siphon-bot"; git config user.email "bot@users.noreply.github.com"
          git fetch -q origin renders && git checkout -q renders
          d=kaggle/run-${{ github.run_number }}
          mkdir -p $d
          find res -type f \( -name '*.mp4' -o -name '*.json' -o -name '*.png' -o -name '*.log' \) -size -40M -exec cp {} $d/ \;
          cp status.txt $d/
          git add $d && git commit -qm "kaggle output ${{ github.run_number }}" && git push -q origin renders
          echo "published $d"
